<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma surpresa 💖</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 400px;
      margin: 20px;
    }

    h1 {
      color: #e63968;
      font-size: 32px;
    }

    p {
      font-size: 20px;
      color: #555;
    }

    #qrcode {
      margin: 25px auto;
      display: flex;
      justify-content: center;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      margin: 8px;
    }

    .yes {
      background: #e63968;
      color: white;
    }

    .no {
      background: #ddd;
      color: #555;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Tenho uma pergunta para ti... 💕</h1>

  <p>
    Queres descobrir uma surpresa?
  </p>

  <!-- O QR CODE -->
  <div id="qrcode"></div>

  <p>
    📱 Faz scan do QR code
  </p>
</div>

<script>
  // ALTERA ESTA URL PARA O ENDEREÇO DA TUA PÁGINA
  const url = "pedido.html";

  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 220,
    height: 220,
    colorDark: "#e63968",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>

</body>
</html>
