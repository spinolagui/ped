<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

<div id="qrcode"></div>

<script>
    const url = "https://spinolagui.github.io/ped/pedido.html";

    new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 251,
        height: 250
    });
</script>

</body>
</html>
