<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: black;
            text-align: center;
            overflow: hidden;
        }

        .container {
            font-size: 28px;
        }

        button {
            background: white;
            color: black;
            border: 1px solid black;
            padding: 10px 25px;
            margin: 20px 5px;
            font-size: 18px;
            cursor: pointer;
        }

        #nao {
            position: relative;
        }

        #resposta {
            margin-top: 20px;
            font-size: 32px;
        }
    </style>
</head>

<body>

<div class="container">

    <div>Queres namorar comigo 2.0?</div>

    <button onclick="responderSim()">YES</button>
    <button id="nao"
            onmouseenter="fugir()"
            ontouchstart="fugir()">
        NO
    </button>

    <div id="resposta"></div>

</div>

<script>
    function responderSim() {
        document.getElementById("resposta").textContent = "YESSSSSS";
    }

    function fugir() {
        const botao = document.getElementById("nao");

        const largura = window.innerWidth - botao.offsetWidth - 20;
        const altura = window.innerHeight - botao.offsetHeight - 20;

        const x = Math.max(10, Math.random() * largura);
        const y = Math.max(10, Math.random() * altura);

        botao.style.position = "fixed";
        botao.style.left = x + "px";
        botao.style.top = y + "px";
        botao.style.margin = "0";
    }
</script>

</body>
</html>
